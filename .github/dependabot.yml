version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: ".github/"
    schedule:
      interval: "weekly"
    allow:
      - dependency-type: "production"
      - dependency-type: "indirect"
    pull-request-branch-name:
      separator: "/"
      prefix: "feature/dependabot"
    cooldown:
      default-days: 7
